<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- LINK OF BOOTSTRAP  -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <!-- LINK OF CSS FILE  -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- TITLE OF NAME  -->
    <title>Forkify-API</title>
</head>

<body style="background-color: #a8d5e2;">

    <main class="py-5">
        <div class="container" style="max-width: 900px;">

            <!-- SEARCH AND FILTER CONTROLS -->
            <div class="row g-2 justify-content-center mb-4">
                <!-- Search Input -->
                <div class="col-12">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search for recipes...">
                </div>

                <!-- WORD OF SELECT OPTION -->
                <div class="col-12">
                    <select id="categorySelect" class="form-select">
                        <option value="carrot">carrot</option>
                        <option value="pizza">pizza</option>
                        <option value="beef">beef</option>
                        <option value="pasta">pasta</option>
                        <option value="chicken">chicken</option>
                        <option value="burger">burger</option>
                        <option value="salad">salad</option>
                        <option value="cake">cake</option>
                        <option value="fish">fish</option>
                        <option value="steak">steak</option>
                    </select>
                </div>
                <!-- GRID CONTAINER OF CARDS  -->
                <div class="row g-3" id="recipesContainer">
                </div>

            </div>
    </main>

    <!-- FOOTER OF PAGE  -->
    <footer class="text-center" style="background-color: #ffffff; height: 5vh;">
        <p>&copf; Created By <span>Ibrahim_Owais</span></p>
    </footer>
    <script src="https://kit.fontawesome.com/58ff671760.js" crossorigin="anonymous"></script>
    <!-- LINK OF JS FILE  -->
    <script src="./js/main.js"></script>
    <!-- LINK OF JS BOOTSTRAP  -->
    <script src="./js/bootstrap.bundle.js"></script>
</body>

</html>
